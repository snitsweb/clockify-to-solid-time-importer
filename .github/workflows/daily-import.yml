name: Daily Import

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC (7 AM Warsaw time in winter, 8 AM in summer)
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create .env file
        run: |
          echo "${{ secrets.SCRIPT_ENVS }}" > .env

      - name: Run import
        run: bun run start

